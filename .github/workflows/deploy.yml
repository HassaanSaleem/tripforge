# Deploy apps/web to Vercel (production) on every push to main.
# Authorized by a VERCEL_TOKEN repo secret (not the git commit author), which
# bypasses Vercel's free-plan git-author "Deployment was blocked" behaviour.
#
# We upload SOURCE and let Vercel BUILD SERVER-SIDE (the same path the working
# dashboard import used). We deliberately do NOT `vercel build` + `--prebuilt`
# locally: next.config uses `output: standalone`, so the prebuilt output bundles
# node_modules and hangs for ~forever on upload from the runner.
name: Deploy to Vercel

# Auto-deploy on push to main is PAUSED (operator, 2026-07-21) while the
# two-sided-surface campaign runs on a branch. Re-enable by uncommenting the
# `push:` trigger below. Manual deploys still work via `workflow_dispatch`.
on:
  # push:
  #   branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Uploads the source; Vercel builds it server-side using the project's own
      # settings (rootDirectory=apps/web, pnpm, env vars). ORG/PROJECT ids link
      # to the existing project non-interactively.
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
