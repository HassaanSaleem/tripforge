name: CI

on:
  push:
    branches: [main, "campaign/**"]
  pull_request:
    branches: [main, "campaign/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test (L1/L2)
        run: npm test

      - name: Architecture boundaries (dependency-cruiser, INV-017)
        run: npm run depcruise
