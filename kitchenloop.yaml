# ─── KitchenLoop Configuration ───────────────────────────────────────────
# Generated by kitchenloop init on 2026-07-03T10:23:32Z

project:
  name: "tripforge"
  description: "AI-native itinerary platform for travel professionals — build itineraries with AI, book net-rate inventory, and trade finished trips on a two-sided marketplace"
  language: "typescript"
  context: |
    tripforge is a typescript project (UI).
    AI-native itinerary platform for travel professionals — build itineraries with AI, book net-rate inventory, and trade finished trips on a two-sided marketplace

    A typical user session:
    An agent logs into the workspace and drafts a client itinerary with AI assistance
    They attach content from the media library and preview the branded client-facing view
    They search net-rate hotel inventory, set their markup, and book it inside the itinerary
    They list a finished itinerary on the marketplace; another agent licenses and white-labels it

    Success = A client-ready branded itinerary with real booked inventory, and marketplace transactions that enforce revenue share and client ownership

repo:
  base_branch: "main"
  pr_target: "main"
  iteration_branch_prefix: "kitchen/iter"
  env_file: ".env"

paths:
  reports: "docs/internal/reports"
  loop_state: "docs/internal/loop-state.md"
  patterns: "memory/codebase-patterns.md"
  logs: ".kitchenloop/logs"
  scenarios: "scenarios/incubating"
  worktree_prefix: ".claude/worktrees"
  execute_worktree: ".claude/worktrees/kitchenloop"
  uat_cards: ".kitchenloop/uat-cards"
  uat_runs: ".kitchenloop/uat-runs"
  unbeatable_tests: ".kitchenloop/unbeatable-tests.md"

spec:
  docs:
    - "docs/product/Trellis_Product_Charter_PRD.pdf"   # authoritative PRD (Charter+PRD v0.3, July 2026)
    - "docs/architecture/system-architecture.md"       # system map + invariants (INV-NNN)
    - ".specify/memory/constitution.md"
  dimensions:
    features:
    - "itinerary-builder"
    - "content-library"
    - "booking"
    - "marketplace"
    - "trust"
    - "revenue-share"
    platforms:
    - "web"
    - "api"
    user_types:
    - "agent-seller"      # specialist/DMC agent building and listing trips (supply side)
    - "agent-reseller"    # agent licensing/white-labeling another agent's trip (demand side)
    - "client"            # traveler viewing the branded client-facing output
  # PRD roadmap discipline — P0 (MVP) is agent-side only. The loop must NOT
  # ideate these until their roadmap phase is unlocked by the operator:
  # P2+: consumer-surface (self-serve planner, self-drive/agent fork), whats-hot-feed
  # P3+: flights-as-merchant-of-record, direct-supplier-contracting,
  #      multi-region-catalogue, consortium/host-agency tooling
  # Never (PRD non-goals): ride-hailing/driver fleet, Airbnb-sourced inventory,
  #      generic consumer trip-planner play, scraped/AI-fabricated place imagery
  blocked: []

verification:
  oracle:
    type: "deterministic"
    full_command: "npm test"
    quick_command: "npm test"
    smoke_command: ""
    lint_command: "npm run lint"
  preflight_env_vars: []
  stop_conditions:
    pass_rate_floor: 0.95
    max_consecutive_failures: 3
    test_count_decline_iters: 3
  skip_policy:
    ideate_fail: "continue"
    execute_fail: "continue"
    regress_fail: "pause"
  merge_gates:
    - "ci_pass"

ticketing:
  provider: "none"
  github:
    labels:
      bug: "bug"
      feature: "enhancement"
      improvement: "improvement"
      exploration: "exploration"
    state_labels:
      todo: "kitchenloop:todo"
      in_progress: "kitchenloop:in-progress"
      in_review: "kitchenloop:in-review"
      done: "kitchenloop:done"

quality:
  bar_file: ".kitchenloop/quality-bar.md"

pr_manager:
  author_allowlist: []
  review_bot: ""                # no CodeRabbit installed — Codex is the external reviewer
  require_ci: true
  skip_after_failures: 1

reviewers:
  codex:
    enabled: true               # primary external reviewer: `codex review --base main`
    timeout: 300
  gemini:
    enabled: false
    timeout: 60

runtime:
  timeouts:
    ideate: 2700
    triage: 1200
    execute: 3600
    polish: 5400
    regress: 9000
    backlog: 900
  backlog_interval: 3
  review_interval: 3
  polish_max_prs: 2
  drain_threshold: 10
  drain_exit_threshold: 5

