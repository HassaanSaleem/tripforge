quality:
  bar_file: ".kitchenloop/quality-bar.md"

# ─── Operator notifications ──────────────────────────────────────────
# The loop actively pings the operator when it files an OPERATOR-DESK ask or
# trips the .kitchenloop/HALT sentinel, so an unattended overnight batch never
# waits silently. Desktop (macOS osascript) is a non-secret toggle here; the
# Slack webhook URL is a secret and lives in .env as KITCHENLOOP_SLACK_WEBHOOK
# (git-ignored) — set it to also get pinged when you're away from the machine.
notify:
  desktop: true                   # macOS notification + terminal bell on desk asks / HALT

pr_manager:
  author_allowlist: []
  review_bot: ""                # no CodeRabbit installed — Codex is the external reviewer
  require_ci: true              # wired D-004 (2026-07-05): CI (.github/workflows/ci.yml) green on merged seed-0001 (main 0a1b1dc)
  skip_after_failures: 2        # escalation ladder reachability: allow a retry before the pr-manager skips, so a transient first failure doesn't strand the ticket

reviewers:
  codex:
    enabled: true               # primary external reviewer: `codex review --base main`
    timeout: 300
  gemini:
    enabled: false
    timeout: 60

runtime:
  timeouts:
    ideate: 2700
    triage: 1200
    execute: 7200   # 3600->7200 (operator, 2026-07-08): seed-0005 built fully (172/172 green) but timed out at 60m during the final Live Test & Fix step, before commit/push. A money-path feature with L3 + live-verify fix cycles needs headroom to reach its PR.
    polish: 5400
    regress: 9000
    backlog: 900
  backlog_interval: 3
  review_interval: 3
  polish_max_prs: 2
  drain_threshold: 10
  drain_exit_threshold: 5

