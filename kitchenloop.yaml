project:
  name: "tripforge"
  description: "AI-native itinerary platform for travel professionals — build itineraries with AI, book net-rate inventory, and trade finished trips on a two-sided marketplace"
  language: "typescript"
  context: |
    tripforge is a typescript project (UI).
    AI-native itinerary platform for travel professionals — build itineraries with AI, book net-rate inventory, and trade finished trips on a two-sided marketplace

    A typical user session:
    An agent logs into the workspace and drafts a client itinerary with AI assistance
    They attach content from the media library and preview the branded client-facing view
    They search net-rate hotel inventory, set their markup, and book it inside the itinerary
    They list a finished itinerary on the marketplace; another agent licenses and white-labels it

    Success = A client-ready branded itinerary with real booked inventory, and marketplace transactions that enforce revenue share and client ownership

repo:
  base_branch: "main"
  pr_target: "main"
  iteration_branch_prefix: "kitchen/iter"
  env_file: ".env"

paths:
  reports: "docs/internal/reports"
  loop_state: "docs/internal/loop-state.md"
  patterns: "memory/codebase-patterns.md"
  logs: ".kitchenloop/logs"
  scenarios: "scenarios/incubating"
  worktree_prefix: ".claude/worktrees"
  execute_worktree: ".claude/worktrees/kitchenloop"
  uat_cards: ".kitchenloop/uat-cards"
  uat_runs: ".kitchenloop/uat-runs"
  unbeatable_tests: ".kitchenloop/unbeatable-tests.md"

spec:
  docs:
    - "docs/product/Trellis_Product_Charter_PRD.pdf"   # authoritative PRD (Charter+PRD v0.3, July 2026)
    - "docs/architecture/system-architecture.md"       # system map + invariants (INV-NNN)
    - ".specify/memory/constitution.md"
  dimensions:
    features:
    - "itinerary-builder"
    # content-library is PRD-anchored (Pillar 1, p.4: content/media library),
    # so it is P0 build surface — NOT P1+/non-goal. It is not yet enumerated in
    # the constitution's P0 list; adding it there is a deferred owner-approved
    # amendment. Until then, ideate may target it and triage must NOT reject it.
    - "content-library"
    - "booking"
    - "marketplace"
    - "trust"
    - "revenue-share"
    platforms:
    - "web"
    - "api"
    user_types:
    - "agent-seller"      # specialist/DMC agent building and listing trips (supply side)
    - "agent-reseller"    # agent licensing/white-labeling another agent's trip (demand side)
    - "client"            # traveler viewing the branded client-facing output
  # PRD roadmap discipline — P0 (MVP) is agent-side only. The loop must NOT
  # ideate these until their roadmap phase is unlocked by the operator.
  # The comments below are the rationale; `blocked` is the machine-readable
  # list (id + phase + reason) the ideate/triage phases filter against so P1+
  # and non-goal work cannot flow into the backlog without an operator decision.
  # P2+: consumer-surface (self-serve planner, self-drive/agent fork), whats-hot-feed
  # P3+: flights-as-merchant-of-record, direct-supplier-contracting,
  #      multi-region-catalogue, consortium/host-agency tooling
  # Never (PRD non-goals): ride-hailing/driver fleet, Airbnb-sourced inventory,
  #      generic consumer trip-planner play, scraped/AI-fabricated place imagery
  blocked:
    # P2+ — consumer surface, unlocks when the operator opens the P2 roadmap phase
    - id: "consumer-surface"
      phase: "P2"
      reason: "Consumer self-serve planner + self-drive/request-agent fork — roadmap P2, not P0"
    - id: "whats-hot-feed"
      phase: "P2"
      reason: "What's-hot discovery feed — roadmap P2"
    # P3+ — unlocks when the operator opens the P3 roadmap phase
    - id: "flights-merchant-of-record"
      phase: "P3"
      reason: "Flights as merchant-of-record — roadmap P3 (P0 treats flights as a budget anchor only)"
    - id: "direct-supplier-contracting"
      phase: "P3"
      reason: "Direct supplier contracting (bypassing aggregators) — roadmap P3"
    - id: "multi-region-catalogue"
      phase: "P3"
      reason: "Multi-region catalogue — roadmap P3"
    - id: "consortium-host-agency-tooling"
      phase: "P3"
      reason: "Consortium / host-agency tooling — roadmap P3"
    # Never — PRD non-goals, rejected at triage (never unlock without an operator decision)
    - id: "ride-hailing-fleet"
      phase: "never"
      reason: "Ride-hailing / driver fleet — PRD non-goal"
    - id: "airbnb-inventory"
      phase: "never"
      reason: "Airbnb-sourced inventory — PRD non-goal"
    - id: "generic-consumer-planner"
      phase: "never"
      reason: "Generic consumer trip-planner play — PRD non-goal"
    - id: "scraped-fabricated-imagery"
      phase: "never"
      reason: "Scraped / AI-fabricated place imagery — PRD non-goal"

verification:
  oracle:
    type: "deterministic"
    full_command: "pnpm test"                           # npm→pnpm 2026-07-06 (repo is a pnpm workspace; npm can't install workspace deps)
    quick_command: "pnpm test"                          # npm→pnpm 2026-07-06
    smoke_command: "node tests/integration/smoke.mjs"   # wired D-004 (2026-07-05)
    lint_command: "pnpm run lint"                        # npm→pnpm 2026-07-06
  # REG-L3-STACK (Option 2, 2026-07-06): in regress, boot the live stack (live.boot_command)
  # around the L3 smoke oracle so L3 is actually exercised, then tear it down. A boot that
  # can't come up in the runtime (image pull / memory / infra) is a WARNING (L3 NOT-RUN),
  # never a product HALT. Set false to skip the regress L3 boot if the host can't host the stack.
  regress_l3_boot: true
  # Live Test & Fix (INV-027, ADR-0003) — every product-behavior ticket is
  # verified against the BUILT compose image before its PR is done:
  # boot -> smoke + Playwright specs -> QA browser journey (Playwright MCP,
  # screenshots) -> compose-log scan -> fix/rebuild/re-test (max 3 cycles).
  # Commands are wired by seed-0001 when the web service lands; empty = the
  # execute phase records SKIPPED (pre-skeleton) explicitly in the PR body.
  # SINGLE SOURCE OF TRUTH: the execute prompt/skill reads the Live Test & Fix
  # commands from `verification.live` here (boot/e2e/logs/teardown/base_url/
  # evidence_dir/max_fix_cycles) — they are NOT hardcoded in the prompt.
  live:
    boot_command: "docker compose down -v && docker compose up --build --wait"   # wired D-004 (2026-07-05)
    e2e_command: "npx playwright test"   # wired D-004 (2026-07-05)
    logs_command: "docker compose logs --no-color"
    teardown_command: "docker compose down -v"
    base_url: "http://localhost:3000"
    evidence_dir: ".kitchenloop/evidence"
    log_error_pattern: "ERROR|FATAL|Unhandled"
    log_allowlist: []             # documented-benign error lines only; additions need justification in the PR
    max_fix_cycles: 3
  preflight_env_vars: []
  stop_conditions:
    pass_rate_floor: 0.95
    max_consecutive_failures: 3
    test_count_decline_iters: 3
  skip_policy:
    ideate_fail: "continue"
    execute_fail: "continue"
    regress_fail: "pause"
  merge_gates:
    - "ci_pass"

